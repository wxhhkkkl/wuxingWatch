[project]
name = "wuxingwatch-backend"
version = "0.1.0"
description = "Mobile BaZi chart tool backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "lunar-python>=1.4.8",
    "pillow>=10.0",
    "pyjwt>=2.8",
    "httpx>=0.27",
    "pymysql>=1.2.0",
    "pwdlib[argon2]>=0.3.0",
    "tzdata>=2026.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
