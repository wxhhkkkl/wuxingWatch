<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WuXing Watch BP</title>
  <meta name="description" content="WuXing Watch business plan presentation" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --ink: #2f251c;
      --muted: #8b7c6b;
      --gold: #c9a46a;
      --panel: rgba(255, 253, 248, 0.92);
      --shadow: rgba(63, 48, 36, 0.18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 14px clamp(16px, 4vw, 56px);
      background: rgba(247, 244, 238, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(201, 164, 106, 0.34);
    }
    .brand {
      min-width: max-content;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
    .hint {
      color: var(--muted);
      font-size: 13px;
    }
    nav {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0;
      scrollbar-width: thin;
    }
    nav a {
      flex: 0 0 auto;
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(201, 164, 106, 0.45);
      border-radius: 999px;
      color: var(--ink);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      background: var(--panel);
    }
    nav a:hover { background: #3f3024; color: #fff7ea; }
    main {
      width: min(1400px, 100%);
      margin: 0 auto;
      padding: clamp(18px, 4vw, 42px) clamp(12px, 3vw, 28px) 64px;
    }
    .slide {
      position: relative;
      margin: 0 auto clamp(22px, 5vw, 54px);
      border-radius: 10px;
      background: #fffdf8;
      box-shadow: 0 18px 48px var(--shadow);
      overflow: hidden;
      border: 1px solid rgba(201, 164, 106, 0.22);
    }
    .slide img {
      display: block;
      width: 100%;
      height: auto;
    }
    .slide-number {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(63, 48, 36, 0.78);
      color: #fff7ea;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.03em;
    }
    footer {
      padding: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; gap: 10px; }
      .hint { display: none; }
      nav { width: 100%; }
      main { padding-left: 8px; padding-right: 8px; }
      .slide { border-radius: 6px; }
      .slide-number { font-size: 10px; top: 8px; right: 8px; }
    }
    @media print {
      header, footer { display: none; }
      main { padding: 0; width: 100%; }
      .slide { box-shadow: none; border: 0; margin: 0; page-break-after: always; }
      .slide-number { display: none; }
    }
  </style>
</head>
