user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	# server_tokens off;

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/nginx/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	# 协议版本在各 server 块内指定（TLSv1.2 TLSv1.3）

	##
	# Logging Settings
	##

	access_log /var/log/nginx/access.log;

	##
	# Gzip Settings
	##

	gzip on;
	gzip_vary on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_types
		text/plain
		text/css
		application/json
		application/javascript
		application/xml
		text/javascript
		image/svg+xml;

	##
	# Virtual Host Configs
	##

	include /etc/nginx/conf.d/*.conf;
	include /etc/nginx/sites-enabled/*;

	##
	# 部署：Vue 前端静态文件（首页即 /home/ubuntu/front/index.html）
	# HTTPS 已在 CDN 边缘节点终止，源站仅提供 HTTP 回源
	##

	# HTTP 主站（CDN 回源 + 直接访问）
	server {
		listen 80;
		listen [::]:80;
		server_name _;

		root /home/ubuntu/front;
		index index.html;

		# 带内容 hash 的静态资源：缓存一年，immutable 免 304 往返
		location /assets/ {
			expires 1y;
			add_header Cache-Control "public, immutable";
		}

		# 入口 HTML 不缓存，保证发版即时生效
		location = /index.html {
			add_header Cache-Control "no-cache";
		}

		# SPA 路由回退：找不到文件时回退到 index.html，交给前端路由处理
		location / {
			try_files $uri $uri/ /index.html;
		}

		# 静态 BP 商务计划页（/bp/ → /home/ubuntu/bp/）
		location = /bp {
			return 301 /bp/;
		}
		location /bp/ {
			alias /home/ubuntu/bp/;
			index index.html;
		}

		# 管理后台 SPA（/admin/ → /home/ubuntu/admin/）
		location = /admin {
			return 301 /admin/;
		}
		location /admin/ {
			alias /home/ubuntu/admin/;
			index index.html;
			try_files $uri $uri/ /admin/index.html;
			# 管理后台 SPA 入口 HTML 不缓存（含目录访问/客户端路由回退），保证发版即时生效
			add_header Cache-Control "no-cache";
		}
		# 管理后台带内容 hash 的静态资源：缓存一年，immutable
		location /admin/assets/ {
			alias /home/ubuntu/admin/assets/;
			expires 1y;
			add_header Cache-Control "public, immutable";
		}

		# 后端 API 反代（FastAPI 监听 127.0.0.1:8000）
		location /api/ {
			proxy_pass http://127.0.0.1:8000;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}


